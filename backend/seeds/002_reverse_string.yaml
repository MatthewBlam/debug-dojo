short_id: "002"
title: "Reverse String"
description: |
  Given a string `s`, return the characters in reverse order. Preserve every
  character exactly, including spaces and punctuation.
difficulty: "easy"
bug_category: "off_by_one"
tags: ["strings", "two pointers"]
function_signature: "def reverse_string(s: str) -> str"
reference_solution: |
  def reverse_string(s):
      return s[::-1]
slop_code: |
  def reverse_string(s):
      result = ""
      for i in range(len(s) - 1, 0, -1):
          result += s[i]
      return result
target_complexity: "O(n)"
test_cases:
  - input:
      s: "dojo"
    is_hidden: false
  - input:
      s: "a"
    is_hidden: false
  - input:
      s: ""
    is_hidden: false
  - input:
      s: "debug dojo"
    is_hidden: true
  - input:
      s: "racecar!"
    is_hidden: true
  - input:
      s: "  lead"
    is_hidden: true
