title: "Group Anagrams"
description: |
  Given an array of strings `strs`, group the anagrams together. You can return
  the answer in any order. An anagram is a word formed by rearranging the
  letters of another word, using all the original letters exactly once.

  Return a list of lists where each inner list contains strings that are
  anagrams of each other. The order of groups and the order within groups
  does not matter.
difficulty: "Medium"
tags: ["strings", "hash map", "sorting"]
function_signature: "def group_anagrams(strs: list[str]) -> list[list[str]]"
reference_solution: |
  def group_anagrams(strs):
      groups = {}
      for s in strs:
          key = ''.join(sorted(s))
          if key not in groups:
              groups[key] = []
          groups[key].append(s)
      return list(groups.values())
target_complexity: "O(n * k log k)"
bug_category: "bad-variable"
num_test_cases: 8
