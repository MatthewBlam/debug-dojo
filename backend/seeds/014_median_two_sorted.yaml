title: "Median of Two Sorted Arrays"
description: |
  Given two sorted arrays `nums1` and `nums2` of size m and n respectively,
  return the median of the two sorted arrays.

  The overall run time complexity should be O(log(min(m, n))).

  If the combined length is even, return the average of the two middle values
  as a float. If odd, return the middle value as a float.
difficulty: "Hard"
tags: ["arrays", "binary search"]
function_signature: "def find_median(nums1: list[int], nums2: list[int]) -> float"
reference_solution: |
  def find_median(nums1, nums2):
      if len(nums1) > len(nums2):
          nums1, nums2 = nums2, nums1
      m, n = len(nums1), len(nums2)
      low, high = 0, m
      while low <= high:
          i = (low + high) // 2
          j = (m + n + 1) // 2 - i
          left1 = nums1[i - 1] if i > 0 else float('-inf')
          right1 = nums1[i] if i < m else float('inf')
          left2 = nums2[j - 1] if j > 0 else float('-inf')
          right2 = nums2[j] if j < n else float('inf')
          if left1 <= right2 and left2 <= right1:
              if (m + n) % 2 == 0:
                  return (max(left1, left2) + min(right1, right2)) / 2.0
              else:
                  return float(max(left1, left2))
          elif left1 > right2:
              high = i - 1
          else:
              low = i + 1
      return 0.0
target_complexity: "O(log(min(m, n)))"
bug_category: "off-by-one"
num_test_cases: 8
