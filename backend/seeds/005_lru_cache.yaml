short_id: "005"
title: "LRU Cache"
description: |
  Simulate an LRU (least recently used) cache. Given a capacity plus parallel
  `operations` and `values` arrays, process `put(key, value)` and `get(key)`.
  Return one output per operation: `None` for each put, the value for a cache hit,
  and `-1` for a cache miss.
difficulty: "hard"
bug_category: "redundant_work"
tags: ["hash map", "design"]
function_signature: "def lru_cache(capacity: int, operations: list[str], values: list[list[int]]) -> list[int | None]"
reference_solution: |
  def lru_cache(capacity, operations, values):
      from collections import OrderedDict
      cache = OrderedDict()
      out = []
      for op, args in zip(operations, values):
          if op == "get":
              key = args[0]
              if key not in cache:
                  out.append(-1)
              else:
                  cache.move_to_end(key)
                  out.append(cache[key])
          else:
              key, value = args
              if key in cache:
                  cache.move_to_end(key)
              cache[key] = value
              if len(cache) > capacity:
                  cache.popitem(last=False)
              out.append(None)
      return out
slop_code: |
  def lru_cache(capacity, operations, values):
      cache = {}
      order = []
      out = []
      for op, args in zip(operations, values):
          if op == "get":
              key = args[0]
              if key not in cache:
                  out.append(-1)
              else:
                  out.append(cache[key])
          else:
              key, value = args
              cache[key] = value
              order.append(key)
              if len(cache) > capacity:
                  oldest = order.pop(0)
                  if oldest in cache:
                      del cache[oldest]
              out.append(None)
      return out
target_complexity: "O(n)"
test_cases:
  - input:
      capacity: 2
      operations: ["put", "put", "get", "put", "get", "put", "get", "get", "get"]
      values: [[1, 1], [2, 2], [1], [3, 3], [2], [4, 4], [1], [3], [4]]
    is_hidden: false
  - input:
      capacity: 1
      operations: ["put", "get", "put", "get", "get"]
      values: [[2, 1], [2], [3, 2], [2], [3]]
    is_hidden: false
  - input:
      capacity: 2
      operations: ["put", "put", "put", "get", "get", "get"]
      values: [[1, 1], [2, 2], [1, 10], [1], [2], [3]]
    is_hidden: false
  - input:
      capacity: 3
      operations: ["put", "put", "put", "get", "put", "get", "get", "get"]
      values: [[1, 1], [2, 2], [3, 3], [1], [4, 4], [2], [3], [4]]
    is_hidden: true
  - input:
      capacity: 2
      operations: ["get", "put", "get", "put", "put", "get"]
      values: [[9], [9, 1], [9], [8, 2], [7, 3], [9]]
    is_hidden: true
