title: "Binary Search"
description: |
  Given a sorted (ascending) integer array `nums` and a target value `target`,
  return the index of `target` if it is present in the array, otherwise
  return -1.

  You must write an algorithm with O(log n) runtime complexity.
difficulty: "Medium"
tags: ["arrays", "binary search"]
function_signature: "def binary_search(nums: list[int], target: int) -> int"
reference_solution: |
  def binary_search(nums, target):
      left, right = 0, len(nums) - 1
      while left <= right:
          mid = left + (right - left) // 2
          if nums[mid] == target:
              return mid
          elif nums[mid] < target:
              left = mid + 1
          else:
              right = mid - 1
      return -1
target_complexity: "O(log n)"
bug_category: "off-by-one"
num_test_cases: 8
