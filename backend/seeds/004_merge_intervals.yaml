short_id: "004"
title: "Merge Intervals"
description: |
  Given a list of intervals `[start, end]`, merge all overlapping intervals
  and return the result sorted by start time.
difficulty: "medium"
bug_category: "missing_edge_case"
tags: ["arrays", "sorting"]
function_signature: "def merge_intervals(intervals: list[list[int]]) -> list[list[int]]"
reference_solution: |
  def merge_intervals(intervals):
      if not intervals:
          return []
      intervals = sorted(intervals, key=lambda item: item[0])
      merged = [intervals[0][:]]
      for start, end in intervals[1:]:
          if start <= merged[-1][1]:
              merged[-1][1] = max(merged[-1][1], end)
          else:
              merged.append([start, end])
      return merged
slop_code: |
  def merge_intervals(intervals):
      if not intervals:
          return []
      intervals = sorted(intervals, key=lambda item: item[0])
      merged = [intervals[0][:]]
      for start, end in intervals[1:]:
          if start < merged[-1][1]:
              merged[-1][1] = max(merged[-1][1], end)
          else:
