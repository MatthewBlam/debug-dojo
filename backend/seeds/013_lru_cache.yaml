title: "LRU Cache"
description: |
  Design a data structure that follows the constraints of a Least Recently Used
  (LRU) cache.

  Implement a function that takes a `capacity` and a list of `operations`, where
  each operation is either `["get", key]` or `["put", key, value]`. Return a
  list of results for each `get` operation (-1 if key not found). `put`
  operations return None in the results list.

  When the cache exceeds its capacity, it should evict the least recently used
  key before inserting a new item.
difficulty: "Hard"
tags: ["hash map", "design", "linked list"]
function_signature: "def lru_cache(capacity: int, operations: list[list]) -> list"
reference_solution: |
  def lru_cache(capacity, operations):
      from collections import OrderedDict
      cache = OrderedDict()
      results = []
      for op in operations:
          if op[0] == "get":
              key = op[1]
              if key in cache:
                  cache.move_to_end(key)
                  results.append(cache[key])
              else:
                  results.append(-1)
          elif op[0] == "put":
              key, value = op[1], op[2]
              if key in cache:
                  cache.move_to_end(key)
              cache[key] = value
              if len(cache) > capacity:
                  cache.popitem(last=False)
              results.append(None)
      return results
target_complexity: "O(1) per operation"
bug_category: "logic-inversion"
num_test_cases: 8
